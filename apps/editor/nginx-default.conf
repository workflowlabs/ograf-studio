server {
    listen       3141;
    server_name  ograf-app;

    #access_log  /var/log/nginx/host.access.log  main;

    location ^~ /ograf.app/assets/ {
        alias /usr/share/nginx/html/ograf.app/assets/;
        try_files $uri =404;
    }

    location ^~ /ograf.app/ {
        alias /usr/share/nginx/html/ograf.app/;
        index  index.html index.htm;
        try_files $uri $uri/ /ograf.app/index.html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}
